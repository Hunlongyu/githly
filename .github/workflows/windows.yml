name: Windows build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --features ui-tests -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --all-targets --features ui-tests -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Install Inno Setup
        run: ./scripts/install-inno.ps1
      - name: Package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/package.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  unix-packages:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/desktop.yml
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, unix-packages]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Only stable vX.Y.Z tags are supported.' }
          $sections = (Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8) -split '(?m)^## '
          $notes = @($sections | Where-Object { $_.StartsWith("$env:RELEASE_TAG · ") })
          if ($notes.Count -ne 1) { throw "Expected one changelog entry for $env:RELEASE_TAG." }
          $body = ($notes[0] -split '\n', 2)[1].Trim()
          $version = $env:RELEASE_TAG.Substring(1)
          $setup = Get-Item -LiteralPath "release/Githly-$version-windows-x64-setup.exe"
          $portable = Get-Item -LiteralPath "release/Githly-$version-windows-x64.zip"
          $platforms = [ordered]@{'macos-arm64' = 'macOS (Apple Silicon)'; 'macos-x64' = 'macOS (Intel)'; 'linux-x64' = 'Linux (amd64)'}
          $url = "https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG"
          $table = @(
            '## 下载'
            ''
            '| 系统 | 下载 |'
            '| --- | --- |'
            "| Windows 10/11 | [![Setup x64](https://img.shields.io/badge/Setup-x64-2d7d9a?style=flat-square)]($url/$($setup.Name))<br>[![Portable x64](https://img.shields.io/badge/Portable-x64-67b7d1?style=flat-square)]($url/$($portable.Name)) |"
            foreach ($platform in $platforms.Keys) {
              $ext = if ($platform -eq 'linux-x64') { 'deb' } else { 'dmg' }
              $package = Get-Item -LiteralPath "release/Githly-$version-$platform.$ext"
              $manifest = Get-Content -LiteralPath "release/update-$platform.json" -Raw | ConvertFrom-Json
              if ($manifest.version -ne $version -or $manifest.installer.url -ne "$url/$($package.Name)" -or $manifest.installer.size -ne $package.Length -or $manifest.installer.sha256 -ne (Get-FileHash -LiteralPath $package.FullName).Hash) { throw "Invalid $platform manifest" }
              "| $($platforms[$platform]) | [$($package.Name)]($url/$($package.Name)) |"
            }
          )
          ((@($body, '') + $table) -join "`n") | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $sums = Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          $sums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
          $artifacts = Get-ChildItem -LiteralPath release -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @artifacts --repo $env:GH_REPO --verify-tag --title "Githly $env:RELEASE_TAG" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed.' }
