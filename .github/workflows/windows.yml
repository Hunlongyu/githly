name: Windows build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --features ui-tests -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --all-targets --features ui-tests -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Install Inno Setup
        run: ./scripts/install-inno.ps1
      - name: Package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./scripts/package.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  unix-packages:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/desktop.yml
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, unix-packages]
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Only stable vX.Y.Z tags are supported.' }
          $sections = (Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8) -split '(?m)^## '
          $notes = @($sections | Where-Object { $_.StartsWith("$env:RELEASE_TAG · ") })
          if ($notes.Count -ne 1) { throw "Expected one changelog entry for $env:RELEASE_TAG." }
          $body = ($notes[0] -split '\n', 2)[1].Trim()
          $version = $env:RELEASE_TAG.Substring(1)
          $downloads = [ordered]@{
            'Windows 10/11' = @(
              @{ file = 'windows-x64-setup.exe'; manifest = 'update.json'; alt = 'Setup x64'; badge = 'Setup-x64-2d7d9a?style=plastic' }
              @{ file = 'windows-x64.zip'; manifest = 'update-windows-x64-portable.json'; alt = 'Portable x64'; badge = 'Portable-x64-67b7d1?style=plastic' }
            )
            'macOS' = @(
              @{ file = 'macos-arm64.dmg'; manifest = 'update-macos-arm64.json'; alt = 'DMG Apple Silicon'; badge = 'DMG-Apple_Silicon-000000?style=plastic&logo=apple&logoColor=white' }
              @{ file = 'macos-x64.dmg'; manifest = 'update-macos-x64.json'; alt = 'DMG Intel X64'; badge = 'DMG-Intel_X64-009ec4?style=plastic&logo=apple&logoColor=white' }
            )
            'Linux' = @(
              @{ file = 'linux-x64.deb'; manifest = 'update-linux-x64.json'; alt = 'DebPackage x64'; badge = 'DebPackage-x64-f29762?style=plastic&logo=debian&logoColor=white' }
            )
          }
          $url = "https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG"
          $badges = 'https://img.shields.io/badge'
          $table = @(
            '## 下载'
            ''
            '| 系统 | 下载 |'
            '| --- | --- |'
            foreach ($os in $downloads.Keys) {
              $buttons = foreach ($item in $downloads[$os]) {
                $package = Get-Item -LiteralPath "release/Githly-$version-$($item.file)"
                $manifest = Get-Content -LiteralPath "release/$($item.manifest)" -Raw -Encoding utf8 | ConvertFrom-Json
                $assetUrl = "$url/$($package.Name)"
                if ($manifest.version -ne $version -or $manifest.installer.url -ne $assetUrl -or $manifest.installer.size -ne $package.Length -or $manifest.installer.sha256 -ne (Get-FileHash -LiteralPath $package.FullName).Hash) { throw "Invalid $($item.manifest)" }
                "[![$($item.alt)]($badges/$($item.badge))]($assetUrl)"
              }
              "| $os | $($buttons -join '<br>') |"
            }
          )
          ((@($body, '') + $table) -join "`n") | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          $sums = Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          $sums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
          $artifacts = Get-ChildItem -LiteralPath release -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @artifacts --repo $env:GH_REPO --verify-tag --title "Githly $env:RELEASE_TAG" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publish failed.' }
