name: macOS and Linux builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-22.04
            platform: linux-x64-appimage
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan-dev libx11-dev libxi-dev libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev mesa-vulkan-drivers xvfb xauth xdotool
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform == 'linux-x64-appimage' && 'appimage-ubuntu-22.04' || '' }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --features ui-tests -- --test-threads=1
      - run: cargo clippy --locked --all-targets --features ui-tests -- -D warnings
      - run: cargo build --release --locked
      - name: Package native application
        run: bash scripts/package-unix.sh "${{ matrix.platform }}"
      - name: Open packaged application
        run: bash scripts/smoke-unix.sh "${{ matrix.platform }}"
      - name: Open the same AppImage on Fedora 44
        if: matrix.platform == 'linux-x64-appimage'
        run: |
          docker run --rm \
            -v "$PWD/dist/linux-x64-appimage:/work/dist/linux-x64-appimage:ro" \
            -v "$PWD/scripts/smoke-unix.sh:/work/scripts/smoke-unix.sh:ro" \
            fedora:44 bash -euc '
              dnf -qy install git-core xorg-x11-server-Xvfb xdotool dbus-daemon mesa-vulkan-drivers libxkbcommon-x11 dejavu-sans-fonts
              bash /work/scripts/smoke-unix.sh linux-x64-appimage
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14
