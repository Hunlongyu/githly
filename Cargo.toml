[package]
name = "githly"
version = "0.1.4"
edition = "2024"

[dependencies]
# Simple Diff needs change emphasis, not a process-wide language grammar cache.
gpui-kit = "=0.9.0"
anyhow = "1"
async-channel = "2"
async-process = "2"
async-io = "2"
blocking = "1"
futures-util = "0.3"
chrono = "0.4"
directories = "6"
futures-lite = "2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
semver = "1"
sha2 = "0.11"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sys-locale = "0.3.2"
tempfile = "3"

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]
ui-tests = ["gpui-kit/test-support"]
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
self-replace = "1"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinHttp", "Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
