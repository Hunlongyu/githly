[package]
name = "githly"
version = "0.1.0"
edition = "2024"

[dependencies]
# Simple Diff needs change emphasis, not a process-wide language grammar cache.
gpui-kit = "=0.9.0"
anyhow = "1"
async-process = "2"
async-io = "2"
chrono = "0.4"
directories = "6"
futures-lite = "2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]
ui-tests = ["gpui-kit/test-support"]
[dev-dependencies]
tempfile = "3"

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
